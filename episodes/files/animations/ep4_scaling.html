<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScaleData puts genes on one footing</title>
<!--
ScaleData puts genes on one footing (Episode 4, scaling)

Steps and captions
 1. Genes differ in magnitude. MALAT1 is high everywhere.
    Three gene rows (MALAT1 near 5, LYZ near 2 with high spread, CD3D near 0.5) across 10 cells as heat strips.
 2. Centre each gene to mean 0.
    Each gene's mean is subtracted. The strips recentre around zero (blue below, red above).
 3. Divide by the standard deviation. Each gene now has SD 1.
    All strips have the same contrast.
 4. Without scaling PC1 follows magnitude. With scaling it follows variation.
    Bars of PC1 weight per gene, before and after ScaleData.

Illustrative: the 30 expression values are simulated (mulberry32, seed 42) around the means given in the brief.
Means and SDs after steps 2 and 3 are computed from those values, so mean 0 and SD 1 are exact.
The step 4 bar lengths are a schematic of PC1 weights, not a real PCA, and carry no numbers.

Controls
 Right arrow or Space: next step. Left arrow: previous step. R: restart. P: autoplay on or off.
 URL: ?step=3 opens at step 3. ?autoplay=1&dwell=3000 plays through with 3000 ms per step.
-->
<style>
html,body{margin:0;padding:0;height:100%;background:#ffffff;overflow:hidden}
svg{display:block;width:100vw;height:100vh;background:#ffffff;--dur:800ms;
  font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:#1f2937}
.mono{font-family:Consolas,Menlo,"DejaVu Sans Mono","Liberation Mono",monospace}
.t{transition:transform var(--dur) ease var(--dd,0ms),opacity var(--dur) ease var(--dd,0ms),fill var(--dur) ease var(--dd,0ms),fill-opacity var(--dur) ease var(--dd,0ms),stroke-opacity var(--dur) ease var(--dd,0ms);transform-origin:0 0}
.halo{paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round}
svg.notrans *{transition:none!important}
@media (prefers-reduced-motion:reduce){svg *{transition:none!important}}
.btn{cursor:pointer}
.btn rect{fill:#ffffff;stroke:#1f2937;stroke-width:3}
.btn text{fill:#1f2937;font-size:26px;text-anchor:middle;font-weight:600}
.btn:hover rect{fill:#f1f5f9}
.btn.off{opacity:.35;pointer-events:none}
#controls.hide{visibility:hidden}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animation: ScaleData puts genes on one footing"></svg>
<script>
(function () {
'use strict';
var NS = 'http://www.w3.org/2000/svg';
var svg = document.getElementById('stage');
var INK = '#1f2937', GOLD = '#ceb888', GRID = '#e2e8f0', UP = '#b22222', DOWN = '#4682b4', CELL = '#2b6cb0';
var N = 4;
var CAPTIONS = [
  'Genes differ in magnitude. MALAT1 is high everywhere.',
  'Centre each gene to mean 0.',
  'Divide by the standard deviation. Each gene now has SD 1.',
  'Without scaling PC1 follows magnitude. With scaling it follows variation.'
];

function el(tag, attrs, parent) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) { e.setAttribute(k, attrs[k]); }
  if (parent) { parent.appendChild(e); }
  return e;
}
function txt(str, attrs, parent) { var e = el('text', attrs, parent); e.textContent = str; return e; }
function tf(e, x, y, sx, sy) {
  e.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + (sx === undefined ? 1 : sx) + ',' + (sy === undefined ? 1 : sy) + ')';
}
function op(e, v) { e.style.opacity = v; }
function sh(e, on, delay) { e.style.setProperty('--dd', on ? (delay || 350) + 'ms' : '0ms'); op(e, on ? 1 : 0); }
function setDd(e, ms) { e.style.setProperty('--dd', ms + 'ms'); }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rnd = mulberry32(42);
function gauss() { var u = 1 - rnd(), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function mix(a, b, t) { return [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t)]; }
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
var LOW = [247, 250, 252], HIGH = [43, 108, 176], WHITE = [255, 255, 255], BLUE = [70, 130, 180], RED = [178, 34, 34];
function seq(v) { return rgb(mix(LOW, HIGH, Math.max(0, Math.min(1, v / 7)))); }
function div(z) { var t = Math.max(-1, Math.min(1, z / 2.5)); return rgb(t < 0 ? mix(WHITE, BLUE, -t) : mix(WHITE, RED, t)); }

/* ---------- frame ---------- */
txt('ScaleData puts genes on one footing', { x: 40, y: 62, 'font-size': 36, 'font-weight': 700, fill: INK }, svg);
txt('Episode 4', { x: 1560, y: 58, 'font-size': 24, 'text-anchor': 'end', fill: INK }, svg);
el('line', { x1: 40, y1: 728, x2: 1560, y2: 728, stroke: GRID, 'stroke-width': 2 }, svg);

/* ---------- data ---------- */
var GENES = [['MALAT1', 5, 1.2], ['LYZ', 2, 1.15], ['CD3D', 0.5, 0.35]];
var rows = GENES.map(function (g) {
  var v = [], i;
  for (i = 0; i < 10; i++) { v.push(Math.max(0, g[1] + g[2] * gauss())); }
  var m = v.reduce(function (a, b) { return a + b; }, 0) / 10;
  var sd = Math.sqrt(v.reduce(function (a, b) { return a + (b - m) * (b - m); }, 0) / 9);
  return { name: g[0], v: v, c: v.map(function (x) { return x - m; }), z: v.map(function (x) { return (x - m) / sd; }) };
});

/* ---------- heat strips ---------- */
var gStrips = el('g', { class: 't' }, svg);
var X0 = 300, CW = 100, RY = [150, 262, 374], RH = 92;
rows.forEach(function (r, k) {
  txt(r.name, { x: X0 - 24, y: RY[k] + RH / 2 + 11, 'font-size': 34, 'font-weight': 700, 'text-anchor': 'end', fill: INK }, gStrips);
  r.cells = r.v.map(function (v, i) {
    var c = el('rect', { class: 't', x: X0 + i * CW + 2, y: RY[k], width: CW - 4, height: RH, fill: seq(v) }, gStrips);
    return c;
  });
});
txt('10 cells', { x: X0 + 5 * CW, y: 506, 'font-size': 28, 'text-anchor': 'middle', fill: INK }, gStrips);
el('line', { x1: X0, y1: 520, x2: X0 + 10 * CW, y2: 520, stroke: INK, 'stroke-width': 3 }, gStrips);
var st2 = [], st3 = [];
rows.forEach(function (r, k) {
  st2.push(txt('mean 0', { x: X0 + 10 * CW + 30, y: RY[k] + RH / 2 + 11, 'font-size': 30, 'font-weight': 700, fill: INK, class: 't' }, gStrips));
  st3.push(txt('mean 0, SD 1', { x: X0 + 10 * CW + 30, y: RY[k] + RH / 2 + 11, 'font-size': 30, 'font-weight': 700, fill: INK, class: 't' }, gStrips));
});
/* legends */
var gLegA = el('g', { class: 't' }, gStrips), gLegB = el('g', { class: 't' }, gStrips);
for (var q = 0; q < 9; q++) {
  el('rect', { x: 560 + q * 54, y: 570, width: 52, height: 30, fill: seq(q / 8 * 7) }, gLegA);
  el('rect', { x: 560 + q * 54, y: 570, width: 52, height: 30, fill: div((q - 4) / 4 * 2.5) }, gLegB);
}
txt('low', { x: 540, y: 595, 'font-size': 28, 'text-anchor': 'end', fill: INK }, gLegA);
txt('high', { x: 560 + 9 * 54 + 16, y: 595, 'font-size': 28, fill: INK }, gLegA);
txt('below the gene mean', { x: 540, y: 595, 'font-size': 28, 'text-anchor': 'end', fill: INK }, gLegB);
txt('above', { x: 560 + 9 * 54 + 16, y: 595, 'font-size': 28, fill: INK }, gLegB);

/* ---------- step 4: PC1 weights ---------- */
var gPca = el('g', { class: 't' }, svg);
var PAN = [{ x: 90, title: 'before ScaleData', w: [0.95, 0.42, 0.08], hot: 0, foot: 'PC1 follows MALAT1' },
           { x: 850, title: 'after ScaleData', w: [0.30, 0.92, 0.55], hot: 1, foot: 'PC1 follows LYZ' }];
var bars = [];
PAN.forEach(function (p, pi) {
  txt(p.title, { x: p.x + 330, y: 150, 'font-size': 34, 'font-weight': 700, 'text-anchor': 'middle', fill: INK }, gPca);
  el('line', { x1: p.x + 190, y1: 190, x2: p.x + 190, y2: 520, stroke: INK, 'stroke-width': 3 }, gPca);
  p.w.forEach(function (w, k) {
    var y = 210 + k * 105;
    txt(GENES[k][0], { x: p.x + 172, y: y + 52, 'font-size': 32, 'font-weight': 700, 'text-anchor': 'end', fill: INK }, gPca);
    var g = el('g', { class: 't' }, gPca);
    tf(g, p.x + 190, y, 1, 1);
    el('rect', { x: 0, y: 0, width: 440 * w, height: 76, fill: k === p.hot ? GOLD : CELL, 'fill-opacity': k === p.hot ? 1 : 0.55, stroke: INK, 'stroke-width': 3 }, g);
    bars.push({ g: g, pi: pi, x: p.x + 190, y: y });
  });
  txt(p.foot, { x: p.x + 330, y: 580, 'font-size': 32, 'font-weight': 700, 'text-anchor': 'middle', fill: INK }, gPca);
  txt('PC1 weight, schematic', { x: p.x + 410, y: 626, 'font-size': 26, 'text-anchor': 'middle', fill: INK }, gPca);
});
el('line', { x1: 770, y1: 340, x2: 830, y2: 340, stroke: INK, 'stroke-width': 4 }, gPca);
el('polygon', { points: '846,340 826,328 826,352', fill: INK }, gPca);

/* ---------- caption, counter, controls ---------- */
var cap = el('text', { x: 40, y: 772, 'font-size': 32, fill: INK }, svg);
var stepTxt = txt('', { x: 40, y: 872, 'font-size': 26, fill: INK }, svg);
var meas = el('text', { x: 0, y: -100, 'font-size': 32, opacity: 0, 'pointer-events': 'none' }, svg);
function wrap(text, maxW) {
  var words = text.split(' '), lines = [], cur = '';
  words.forEach(function (w) {
    var test = cur ? cur + ' ' + w : w;
    meas.textContent = test;
    if (meas.getComputedTextLength() > maxW && cur) { lines.push(cur); cur = w; } else { cur = test; }
  });
  if (cur) { lines.push(cur); }
  return lines;
}
function setCaption(step) {
  var lines = wrap(CAPTIONS[step - 1], 1500);
  while (cap.firstChild) { cap.removeChild(cap.firstChild); }
  lines.forEach(function (ln, n) { var ts = el('tspan', { x: 40, dy: n ? 42 : 0 }, cap); ts.textContent = ln; });
  cap.setAttribute('data-lines', lines.length);
}
var controls = el('g', { id: 'controls' }, svg);
function mkBtn(label, x, w, fn) {
  var b = el('g', { class: 'btn' }, controls);
  el('rect', { x: x, y: 836, width: w, height: 48, rx: 6, ry: 6 }, b);
  var t = txt(label, { x: x + w / 2, y: 869 }, b);
  b.addEventListener('click', fn);
  b._t = t;
  return b;
}
var bPrev = mkBtn('Prev', 1032, 124, function () { prev(); });
var bNext = mkBtn('Next', 1168, 124, function () { next(); });
var bPlay = mkBtn('Play', 1304, 124, function () { toggleAuto(); });
var bRestart = mkBtn('Restart', 1440, 140, function () { restart(); });


/* ---------- state rendering ---------- */
function render(s) {
  sh(gStrips, s <= 3, 350);
  sh(gPca, s === 4, 350);
  rows.forEach(function (r) {
    r.cells.forEach(function (c, i) {
      c.style.fill = s === 1 ? seq(r.v[i]) : (s === 2 ? div(r.c[i]) : div(r.z[i]));
    });
  });
  st2.forEach(function (t) { op(t, s === 2 ? 1 : 0); });
  st3.forEach(function (t) { op(t, s === 3 ? 1 : 0); });
  op(gLegA, s === 1 ? 1 : 0); op(gLegB, s >= 2 ? 1 : 0);
  bars.forEach(function (b) {
    var on = s === 4;
    setDd(b.g, on ? (b.pi === 0 ? 500 : 1700) : 0);
    tf(b.g, b.x, b.y, on ? 1 : 0, 1);
    op(b.g, on ? 1 : 0);
  });
}

/* ---------- navigation, autoplay ---------- */
var params = new URLSearchParams(window.location.search);
var cur = parseInt(params.get('step'), 10); if (!(cur >= 1 && cur <= N)) { cur = 1; }
var dwell = parseInt(params.get('dwell'), 10); if (!(dwell > 0)) { dwell = 4000; }
var auto = params.get('autoplay') === '1';
var timer = null, hideTimer = null;

function updateUI() {
  setCaption(cur);
  stepTxt.textContent = cur + ' / ' + N;
  bPrev.classList.toggle('off', cur === 1);
  bNext.classList.toggle('off', cur === N);
  bPlay._t.textContent = auto ? 'Pause' : 'Play';
  svg.setAttribute('data-step', cur);
}
function go(n) {
  n = Math.max(1, Math.min(N, n));
  if (n === cur) { return; }
  cur = n; render(cur); updateUI();
}
function schedule() {
  clearTimeout(timer);
  if (!auto) { return; }
  timer = setTimeout(function () {
    if (cur < N) { go(cur + 1); schedule(); } else { setAuto(false); showControls(); }
  }, dwell);
}
function setAuto(v) {
  auto = v; updateUI();
  if (auto) { controls.classList.add('hide'); } else { clearTimeout(hideTimer); controls.classList.remove('hide'); }
  schedule();
}
function showControls() {
  controls.classList.remove('hide');
  clearTimeout(hideTimer);
  if (auto) { hideTimer = setTimeout(function () { if (auto) { controls.classList.add('hide'); } }, 3000); }
}
function next() { go(cur + 1); schedule(); }
function prev() { go(cur - 1); schedule(); }
function restart() { go(1); schedule(); }
function toggleAuto() { setAuto(!auto); }

window.addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) { return; }
  var k = e.key, handled = true;
  if (k === 'ArrowRight' || k === ' ' || k === 'Spacebar') { next(); }
  else if (k === 'ArrowLeft') { prev(); }
  else if (k === 'r' || k === 'R') { restart(); }
  else if (k === 'p' || k === 'P') { toggleAuto(); }
  else { handled = false; }
  if (handled) { e.preventDefault(); }
  showControls();
});

/* first render without animation */
svg.classList.add('notrans');
render(cur); updateUI();
if (auto) { controls.classList.add('hide'); schedule(); }
void svg.getBoundingClientRect();
requestAnimationFrame(function () { requestAnimationFrame(function () { svg.classList.remove('notrans'); }); });
})();
</script>
</body>
</html>
